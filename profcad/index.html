<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

<header>
  <img src="../profceiss-logo.svg" alt="Profceiss" onerror="this.style.display='none'">

<div class="main">
  <div class="left">
    <div class="cats">
      <button class="cat on" data-cat="casa">🏠 Elemente casa</button>
      <button class="cat" data-cat="pv">☀️ Sistem fotovoltaic</button>
    </div>
    <div class="tools" id="toolsCasa">
      <button class="btn on" id="tFoot">✏️ Contur</button>
      <button class="btn" id="tEdit">🖐 Muta colturi</button>
      <button class="btn" id="tAddWall">＋ Perete</button>
      <button class="btn" id="tRidge">＋ Coama</button>
      <select id="openType" class="btn" style="width:auto"><option value="">＋ Adauga element…</option><option value="usa">Usa</option><option value="gol_usa">Gol usa</option><option value="fereastra">Fereastra</option><option value="gol_fereastra">Gol fereastra</option><option value="horn">Horn</option><option value="velux">Velux</option></select>
      <button class="btn bad" id="tDel">🗑 Sterge element</button>
      <button class="btn" id="tUndo">↶ Undo</button>
      <button class="btn" id="tFit">⊡ Incadreaza</button>
      <button class="btn" id="tClose">⭙ Inchide</button>
      <button class="btn bad" id="tClearAll">Goleste tot</button>
    </div>
    <div class="tools" id="toolsPv" style="display:none">
      <button class="pvbtn" data-pv="invertor">🔌 <b>Invertor</b> <span>on-grid / hibrid</span></button>
      <button class="pvbtn" data-pv="baterie">🔋 <b>Baterie</b> <span>stocare</span></button>
      <button class="pvbtn" data-pv="tablou">🟩 <b>Tablou electric de protectie</b></button>
      <button class="pvbtn" data-pv="teg">📟 <b>TEG</b> <span>tablou electric general</span></button>
      <button class="pvbtn" data-pv="bmp">📦 <b>BMP</b> <span>bloc masura si protectie</span></button>
      <button class="pvbtn" data-pv="bmpt">📦 <b>BMPT</b> <span>bloc masura si protectie trifazat</span></button>
      <div style="display:flex;gap:6px;margin-top:4px">
        <button class="btn" id="pvLoad" style="flex:1">📥 Incarca Excel</button>
        <button class="btn" id="pvTemplate" style="flex:1">📄 Descarca model</button>
      </div>
      <input id="pvFile" type="file" accept=".xlsx" style="display:none">
      <div id="pvStatus" style="font-size:10.5px;color:var(--muted)"></div>
      <div id="bom" style="display:flex;flex-direction:column;gap:5px"></div>
    </div>
    <div class="planwrap">
      <canvas id="plan"></canvas>
    </div>
    <div class="walls" id="wallList"></div>
    <div class="elems" id="elemList"></div>
    <div class="dims" id="dimsCasa">
      <label>Inaltime pereti <input id="wallH" type="number" min="180" max="600" step="10" value="300"> cm</label>
      <label>Coama <input id="ridgeH" type="number" min="0" max="400" step="10" value="160"> cm</label>
      <label>Streasina <input id="eaveH" type="number" min="0" max="300" step="5" value="40"> cm</label>
      <label>Apa <select id="roofLogic" style="width:auto"><option value="auto">Automat (apele se calculeaza)</option><option value="manual">Coame manuale</option></select></label>
      <label>Acoperis <select id="roofType" style="width:auto"><option value="tigla">Tigla</option><option value="tabla">Tabla cutata</option><option value="tabla_tigla">Tabla tip tigla</option><option value="terasa">Terasa (membrana)</option></select></label>
      <div style="display:flex;flex-direction:column;align-items:center;gap:2px">
        <canvas id="compassDial" width="104" height="104" style="width:104px;height:104px;cursor:grab;touch-action:none"></canvas>
        <span style="font-size:10.5px;color:var(--muted)">Nord fata de casa: <b id="orientVal">0&deg;</b> · roteste busola</span>
      </div>
      <label>Horn: l <input id="chimSize" type="number" min="20" max="200" step="5" value="60"> cm · h <input id="chimH" type="number" min="20" max="400" step="10" value="100"> cm</label>
    </div>
  </div>
  <div class="right">
    <canvas id="view"></canvas>
    <div class="views" id="views">
      <button class="vbtn on" data-view="3d">3D</button>
      <button class="vbtn" data-view="fata">Fata</button>
      <button class="vbtn" data-view="spate">Spate</button>
      <button class="vbtn" data-view="stanga">Stanga</button>
      <button class="vbtn" data-view="dreapta">Dreapta</button>
      <button class="vbtn" data-view="sus">Sus</button>
    </div>
    <div class="vhint">Drag = roteste · scroll = zoom · drag-dreapta = pan</div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id);
let Delaunator=null; import('https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm').then(m=>{ Delaunator=m.default||m; try{ if(footClosed) build3D(); }catch(e){} }).catch(()=>{});

/* ===== stare (metri) ===== */
let foot=[{x:0,z:0},{x:8,z:0},{x:8,z:6},{x:0,z:6}];
let footClosed=true;
let ridges=[{a:{x:0,z:3},b:{x:8,z:3}}];   // coame = segmente {a,b}, ambele capete la inaltimea coamei
let pendingRidge=null, mouseW=null;        // primul capat plasat + pozitia mouse (linie elastica)
let openings=[];               // {wall,pos,w,sill,head,type}
let chimneys=[];               // {x,z,size,height}
let wallH=3.0, ridgeRaise=1.6, orientationDeg=0, roofType='tigla', eaveOverhang=0.4, roofLogic='auto';
let chimSize=0.6, chimH=1.0, openType='';
let pvItems=[];                // elemente sistem fotovoltaic plasate {cat,name,h,w,d (m),x,z,place}
let veluxes=[];                // ferestre de mansarda {x,z,w,l (m)} pe acoperis
let roofEdgesCache=[], roofScaleCache=1;   // pt inaltimea acoperisului intr-un punct (velux)
let mode='foot', drag=null, planMap={s:30,ox:0,oy:0};
let planZoom=1, planPan={x:0,y:0}; const history=[];
const OPEN_DEF={ usa:{w:0.9,sill:0,head:2.05}, gol_usa:{w:0.9,sill:0,head:2.05}, fereastra:{w:1.2,sill:0.9,head:2.1}, gol_fereastra:{w:1.2,sill:0.9,head:2.1} };
function normalizeRidges(arr){ if(!Array.isArray(arr)) return []; return arr.map(r=>{ if(r&&r.a&&r.b) return {a:{x:+r.a.x,z:+r.a.z},b:{x:+r.b.x,z:+r.b.z}}; if(Array.isArray(r)&&r.length>=2){ const f=r[0],l=r[r.length-1]; return {a:{x:+f.x,z:+f.z},b:{x:+l.x,z:+l.z}}; } return null; }).filter(Boolean); }
function snapshot(){ return JSON.stringify({foot,footClosed,ridges,openings,chimneys,pvItems,veluxes,wallH,ridgeRaise,eaveOverhang,roofLogic,orientationDeg,roofType}); }
function commit(){ const s=snapshot(); if(history.length && history[history.length-1]===s) return; history.push(s); if(history.length>100) history.shift(); }
function restore(s){ const o=JSON.parse(s); foot=o.foot; footClosed=o.footClosed; ridges=normalizeRidges(o.ridges); pendingRidge=null; openings=o.openings; chimneys=o.chimneys; pvItems=o.pvItems||[]; veluxes=o.veluxes||[]; wallH=o.wallH; ridgeRaise=o.ridgeRaise; eaveOverhang=o.eaveOverhang||0; roofLogic=o.roofLogic||'auto'; orientationDeg=o.orientationDeg; roofType=o.roofType;
  $('wallH').value=Math.round(wallH*100); $('ridgeH').value=Math.round(ridgeRaise*100); $('eaveH').value=Math.round(eaveOverhang*100); $('roofLogic').value=roofLogic; $('roofType').value=roofType; const ov=$('orientVal'); if(ov) ov.innerHTML=orientationDeg+'&deg;'; drawCompassDial(); drawPlan(); build3D(); renderBom(); renderElemList(); }
function undo(){ if(history.length<2) return; history.pop(); restore(history[history.length-1]); }

/* ===== canvas 2D ===== */
const pc=$('plan'), px=pc.getContext('2d');
function fitPC(){ const r=pc.getBoundingClientRect(),dpr=devicePixelRatio||1; pc.width=r.width*dpr; pc.height=r.height*dpr; px.setTransform(dpr,0,0,dpr,0,0); }
function allPts(){ const a=foot.slice(); ridges.forEach(r=>a.push(r.a,r.b)); if(pendingRidge) a.push(pendingRidge); chimneys.forEach(c=>a.push(c)); return a.length?a:[{x:0,z:0},{x:6,z:4}]; }
function computeMap(){ const W=pc.clientWidth,H=pc.clientHeight,pts=allPts(); let mnx=1e9,mnz=1e9,mxx=-1e9,mxz=-1e9; pts.forEach(p=>{mnx=Math.min(mnx,p.x);mnz=Math.min(mnz,p.z);mxx=Math.max(mxx,p.x);mxz=Math.max(mxz,p.z);});
  const pad=46,baseS=Math.min((W-2*pad)/Math.max(1,mxx-mnx),(H-2*pad)/Math.max(1,mxz-mnz)),bS=Math.min(80,Math.max(8,baseS));
  const s=bS*planZoom,cx=(mnx+mxx)/2,cz=(mnz+mxz)/2;
  planMap={s, ox:W/2-cx*s+planPan.x, oy:H/2+cz*s+planPan.y}; }
const SX=x=>planMap.ox+x*planMap.s, SY=z=>planMap.oy-z*planMap.s;
function world(ev){ const r=pc.getBoundingClientRect(); return {x:(ev.clientX-r.left-planMap.ox)/planMap.s, z:(planMap.oy-(ev.clientY-r.top))/planMap.s}; }
const snap=v=>Math.round(v/0.05)*0.05;
/* ===== geometrie comuna ===== */
function projOnSeg(p,a,b){ const dx=b.x-a.x,dz=b.z-a.z,L2=dx*dx+dz*dz||1; let t=((p.x-a.x)*dx+(p.z-a.z)*dz)/L2; t=Math.max(0,Math.min(1,t)); return {x:a.x+t*dx,z:a.z+t*dz}; }
function pointInPoly(x,z){ let inside=false; const n=foot.length; for(let i=0,j=n-1;i<n;j=i++){ const xi=foot[i].x,zi=foot[i].z,xj=foot[j].x,zj=foot[j].z; if(((zi>z)!==(zj>z)) && (x<(xj-xi)*(z-zi)/((zj-zi)||1e-9)+xi)) inside=!inside; } return inside; }
function distToFoot(p){ let d=1e9; const n=foot.length; for(let i=0;i<n;i++){ const q=projOnSeg(p,foot[i],foot[(i+1)%n]); d=Math.min(d,Math.hypot(p.x-q.x,p.z-q.z)); } return d; }
// contur marit spre exterior cu "o" metri (streasina). pozitiv = mai mare ca amprenta
function intersectLines(l1,l2){ const den=l1.dx*l2.dz-l1.dz*l2.dx; if(Math.abs(den)<1e-9) return {x:l2.px,z:l2.pz}; const t=((l2.px-l1.px)*l2.dz-(l2.pz-l1.pz)*l2.dx)/den; return {x:l1.px+l1.dx*t, z:l1.pz+l1.dz*t}; }
function offsetFootprint(o){ const n=foot.length; if(n<3||Math.abs(o)<1e-4) return foot.map(p=>({x:p.x,z:p.z}));
  let area=0; for(let i=0;i<n;i++){ const a=foot[i],b=foot[(i+1)%n]; area+=a.x*b.z-b.x*a.z; } const sign=area>0?1:-1;
  const lines=[]; for(let i=0;i<n;i++){ const a=foot[i],b=foot[(i+1)%n]; let dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz)||1; dx/=L;dz/=L; let nx=dz*sign, nz=-dx*sign; lines.push({px:a.x+nx*o, pz:a.z+nz*o, dx, dz}); }
  const out=[]; for(let i=0;i<n;i++){ const p=intersectLines(lines[(i-1+n)%n],lines[i]); out.push(p); } return out; }
// lipeste un punct de coama (capat/segment) sau colt existent, ca sa imbini coamele
function snapRidgePoint(w){
  let best=null,bd=0.4; ridges.forEach(r=>['a','b'].forEach(k=>{ const d=Math.hypot(w.x-r[k].x,w.z-r[k].z); if(d<bd){bd=d;best={x:r[k].x,z:r[k].z};} }));
  if(best) return best;
  let bs=null,bsd=0.3; ridges.forEach(r=>{ const q=projOnSeg(w,r.a,r.b); const d=Math.hypot(w.x-q.x,w.z-q.z); if(d<bsd){bsd=d;bs=q;} });
  if(bs) return {x:snap(bs.x),z:snap(bs.z)};
  let bc=null,bcd=0.4; foot.forEach(p=>{ const d=Math.hypot(w.x-p.x,w.z-p.z); if(d<bcd){bcd=d;bc=p;} });
  if(bc) return {x:bc.x,z:bc.z};
  return {x:snap(w.x),z:snap(w.z)};
}

function drawPlan(){ fitPC(); computeMap(); const W=pc.clientWidth,H=pc.clientHeight; px.clearRect(0,0,W,H);
  px.strokeStyle='#dce5f0'; px.lineWidth=1; const pts=allPts(); let mnx=1e9,mnz=1e9,mxx=-1e9,mxz=-1e9; pts.forEach(p=>{mnx=Math.min(mnx,p.x);mnz=Math.min(mnz,p.z);mxx=Math.max(mxx,p.x);mxz=Math.max(mxz,p.z);});
  for(let gx=Math.floor(mnx)-1;gx<=Math.ceil(mxx)+1;gx+=0.5){ px.beginPath(); px.moveTo(SX(gx),0); px.lineTo(SX(gx),H); px.stroke(); }
  for(let gz=Math.floor(mnz)-1;gz<=Math.ceil(mxz)+1;gz+=0.5){ px.beginPath(); px.moveTo(0,SY(gz)); px.lineTo(W,SY(gz)); px.stroke(); }
  // busola
  px.fillStyle='#c0392b'; px.font='700 13px system-ui'; px.textAlign='center'; const a=orientationDeg*Math.PI/180; const cxp=W-40,cyp=40,rr=20;
  const nx=cxp+Math.sin(a)*rr, ny=cyp-Math.cos(a)*rr; px.strokeStyle='#c0392b'; px.lineWidth=2; px.beginPath(); px.moveTo(cxp,cyp); px.lineTo(nx,ny); px.stroke(); px.fillText('N',nx,ny-4);
  // streasina (conturul acoperisului, mai mare ca amprenta)
  if(footClosed && foot.length>=3 && eaveOverhang>0.01){ const rf=offsetFootprint(eaveOverhang); px.strokeStyle='#b9a25a'; px.lineWidth=1.5; px.setLineDash([6,4]); px.beginPath(); rf.forEach((p,i)=> i?px.lineTo(SX(p.x),SY(p.z)):px.moveTo(SX(p.x),SY(p.z))); px.closePath(); px.stroke(); px.setLineDash([]); }
  // contur
  if(foot.length){ px.strokeStyle='#1c7bd6'; px.lineWidth=4; px.lineJoin='round'; px.beginPath(); foot.forEach((p,i)=> i?px.lineTo(SX(p.x),SY(p.z)):px.moveTo(SX(p.x),SY(p.z))); if(footClosed) px.closePath(); px.stroke();
    // goluri (usi/ferestre) pe pereti
    openings.forEach(o=>{ const A=foot[o.wall], B=foot[(o.wall+1)%foot.length]; if(!A||!B) return; const dx=B.x-A.x,dz=B.z-A.z,L=Math.hypot(dx,dz)||1,ux=dx/L,uz=dz/L;
      const p1={x:A.x+ux*o.pos,z:A.z+uz*o.pos}, p2={x:A.x+ux*(o.pos+o.w),z:A.z+uz*(o.pos+o.w)};
      px.strokeStyle=o.type.indexOf('usa')>=0?'#8a5a2b':'#3a9fd6'; px.lineWidth=6; px.beginPath(); px.moveTo(SX(p1.x),SY(p1.z)); px.lineTo(SX(p2.x),SY(p2.z)); px.stroke(); });
    px.fillStyle='#1b2a44'; px.font='700 12px system-ui'; const n=footClosed?foot.length:foot.length-1;
    for(let i=0;i<n;i++){ const a2=foot[i],b=foot[(i+1)%foot.length]; const len=Math.round(Math.hypot(b.x-a2.x,b.z-a2.z)*100); px.fillText(len+' cm',(SX(a2.x)+SX(b.x))/2,(SY(a2.z)+SY(b.z))/2-6); }
    foot.forEach((p,i)=>{ px.fillStyle=(i===0&&mode==='foot')?'#34d399':'#ffb020'; px.beginPath(); px.arc(SX(p.x),SY(p.z),6,0,7); px.fill(); }); }

    [r.a,r.b].forEach(p=>{ px.fillStyle='#d98200'; px.beginPath(); px.arc(SX(p.x),SY(p.z),5,0,7); px.fill(); }); });
  // capat coama in asteptare + linie elastica spre cursor

    px.fillStyle='#34d399'; px.beginPath(); px.arc(SX(pendingRidge.x),SY(pendingRidge.z),7,0,7); px.fill(); px.strokeStyle='#0d8f55'; px.lineWidth=2; px.stroke(); }
  // hornuri (patrat)

    // maner redimensionare (dreapta-jos)
    px.fillStyle='#1c7bd6'; px.beginPath(); px.arc(cx+h/2,cy+h/2,6,0,7); px.fill(); px.strokeStyle='#fff'; px.lineWidth=1.5; px.stroke();

  // elemente PV (dreptunghi latime x grosime + eticheta + X)

  pvItems.forEach(it=>{ const w_=Math.max(10,it.w*planMap.s), d_=Math.max(10,it.d*planMap.s), cx=SX(it.x), cy=SY(it.z); const col=PV_C2[it.cat]||'#2b6cb0';
    px.fillStyle='rgba(43,108,176,.16)'; px.strokeStyle=col; px.lineWidth=2; px.fillRect(cx-w_/2,cy-d_/2,w_,d_); px.strokeRect(cx-w_/2,cy-d_/2,w_,d_);
    px.fillStyle=col; px.font='700 10px system-ui'; px.textAlign='center'; px.textBaseline='middle'; px.fillText(pvIcon(it.cat),cx,cy);
    px.fillStyle='#c0392b'; px.beginPath(); px.arc(cx+w_/2,cy-d_/2,7,0,7); px.fill(); px.fillStyle='#fff'; px.font='700 11px system-ui'; px.fillText('x',cx+w_/2,cy-d_/2); });
  // velux (dreptunghi pe acoperis + maner resize + X)

  renderWalls();

/* ===== interactiune 2D ===== */
function nearest(list,w,maxd){ let bi=-1,bd=maxd; list.forEach((p,i)=>{ const d=Math.hypot(w.x-p.x,w.z-p.z); if(d<bd){bd=d;bi=i;} }); return bi; }
function nearestWall(w){ let bi=-1,bd=0.6,bt=0; const n=foot.length; for(let i=0;i<n;i++){ const A=foot[i],B=foot[(i+1)%n]; const dx=B.x-A.x,dz=B.z-A.z,L2=dx*dx+dz*dz||1; let t=((w.x-A.x)*dx+(w.z-A.z)*dz)/L2; t=Math.max(0,Math.min(1,t)); const qx=A.x+t*dx,qz=A.z+t*dz; const d=Math.hypot(w.x-qx,w.z-qz); if(d<bd){bd=d;bi=i;bt=t*Math.sqrt(L2);} } return bi<0?null:{wall:bi,pos:bt}; }
function screenPt(ev){ const r=pc.getBoundingClientRect(); return {x:ev.clientX-r.left, y:ev.clientY-r.top}; }
pc.addEventListener('pointerdown',ev=>{ const w=world(ev);
  // manere horn (active in orice mod): X = sterge, cerc albastru = redimensioneaza, corp = muta
  { const sp=screenPt(ev); for(let i=chimneys.length-1;i>=0;i--){ const c=chimneys[i], cx=SX(c.x), cy=SY(c.z), half=c.size*planMap.s/2;
      if(Math.hypot(sp.x-(cx+half),sp.y-(cy-half))<12){ chimneys.splice(i,1); drawPlan(); build3D(); renderElemList(); commit(); return; }
      if(Math.hypot(sp.x-(cx+half),sp.y-(cy+half))<12){ drag={kind:'hornsize',i}; return; }
      if(Math.abs(sp.x-cx)<=half+2 && Math.abs(sp.y-cy)<=half+2){ drag={kind:'horn',i}; return; } } }
  // manere velux: X = sterge, cerc albastru = redimensioneaza, corp = muta
  { const sp=screenPt(ev); for(let i=veluxes.length-1;i>=0;i--){ const v=veluxes[i], cx=SX(v.x), cy=SY(v.z), hw=Math.max(5,v.w*planMap.s/2), hl=Math.max(5,v.l*planMap.s/2);
      if(Math.hypot(sp.x-(cx+hw),sp.y-(cy-hl))<12){ veluxes.splice(i,1); drawPlan(); build3D(); renderElemList(); commit(); return; }
      if(Math.hypot(sp.x-(cx+hw),sp.y-(cy+hl))<12){ drag={kind:'veluxsize',i}; return; }
      if(Math.abs(sp.x-cx)<=hw+2 && Math.abs(sp.y-cy)<=hl+2){ drag={kind:'velux',i}; return; } } }
  // manere elemente PV: X = sterge, corp = muta
  { const sp=screenPt(ev); for(let i=pvItems.length-1;i>=0;i--){ const it=pvItems[i], cx=SX(it.x), cy=SY(it.z), hw=Math.max(5,it.w*planMap.s/2), hd=Math.max(5,it.d*planMap.s/2);
      if(Math.hypot(sp.x-(cx+hw),sp.y-(cy-hd))<12){ pvItems.splice(i,1); drawPlan(); build3D(); renderBom(); commit(); return; }
      if(Math.abs(sp.x-cx)<=hw+2 && Math.abs(sp.y-cy)<=hd+2){ drag={kind:'pv',i}; return; } } }
  // manere goluri (usa/fereastra): X = sterge, corp = muta pe perete
  { const sp=screenPt(ev); for(let i=openings.length-1;i>=0;i--){ const o=openings[i],A=foot[o.wall],B=foot[(o.wall+1)%foot.length]; if(!A||!B) continue; const ux=(B.x-A.x),uz=(B.z-A.z),L=Math.hypot(ux,uz)||1; const mx=A.x+ux/L*(o.pos+o.w/2),mz=A.z+uz/L*(o.pos+o.w/2),cx=SX(mx),cy=SY(mz);
      if(Math.hypot(sp.x-(cx+10),sp.y-(cy-10))<12){ openings.splice(i,1); drawPlan(); build3D(); renderElemList(); commit(); return; }
      if(Math.hypot(sp.x-cx,sp.y-cy)<11){ drag={kind:'opening',i}; return; } } }
  if(mode==='addwall'){ const hit=nearestWall(w); if(hit){ const A=foot[hit.wall],B=foot[(hit.wall+1)%foot.length]; const ux=(B.x-A.x),uz=(B.z-A.z),L=Math.hypot(ux,uz)||1; foot.splice(hit.wall+1,0,{x:snap(A.x+ux/L*hit.pos),z:snap(A.z+uz/L*hit.pos)}); openings=openings.filter(o=>o.wall!==hit.wall); openings.forEach(o=>{ if(o.wall>hit.wall) o.wall++; }); mode='edit'; setTools(); drawPlan(); build3D(); } return; }
  if(mode==='del'){ delElement(w); return; }
  if(mode==='edit'){ const i=nearest(foot,w,0.35); if(i>=0){ drag={kind:'foot',i}; return; }
    let best=null,bd=0.35; ridges.forEach((r,ri)=>['a','b'].forEach(k=>{ const d=Math.hypot(w.x-r[k].x,w.z-r[k].z); if(d<bd){bd=d;best={ri,k};} })); if(best) drag={kind:'ridge',ri:best.ri,k:best.k}; return; }
  if(mode==='open'){
    if(openType==='horn'){ chimneys.push({x:snap(w.x),z:snap(w.z),size:chimSize,height:chimH}); drawPlan(); build3D(); renderElemList(); commit(); return; }
    if(openType==='velux'){ if(footClosed && foot.length>=3 && pointInPolyG(foot,w.x,w.z)){ veluxes.push({x:snap(w.x),z:snap(w.z),w:0.78,l:1.18}); drawPlan(); build3D(); renderElemList(); commit(); } return; }
    if(openType){ const hit=nearestWall(w); if(hit){ const d=OPEN_DEF[openType]; const L=wallLen(hit.wall); let pos=Math.max(0,Math.min(L-d.w,hit.pos-d.w/2)); openings.push({wall:hit.wall,pos,w:d.w,sill:d.sill,head:Math.min(d.head,wallH),type:openType}); drawPlan(); build3D(); renderElemList(); commit(); } }
    return; }
  if(mode==='ridge'){
    if(!pendingRidge){
      // atingi un capat existent -> il muti
      let best=null,bd=0.4; ridges.forEach((r,ri)=>['a','b'].forEach(k=>{ const d=Math.hypot(w.x-r[k].x,w.z-r[k].z); if(d<bd){bd=d;best={ri,k};} }));
      if(best){ drag={kind:'ridge',ri:best.ri,k:best.k}; return; }
      // atingi corpul coamei -> muti toata coama
      let bs=-1,bsd=0.3; ridges.forEach((r,ri)=>{ const q=projOnSeg(w,r.a,r.b); const d=Math.hypot(w.x-q.x,w.z-q.z); if(d<bsd){bsd=d;bs=ri;} });
      if(bs>=0){ drag={kind:'ridgemove',ri:bs,lx:w.x,lz:w.z}; return; }
    }
    // pe gol: click 1 = un capat, click 2 = celalalt capat (se lipeste de coame/colturi -> imbinare)
    const p=snapRidgePoint(w);
    if(!pendingRidge){ pendingRidge=p; }
    else { if(Math.hypot(p.x-pendingRidge.x,p.z-pendingRidge.z)>0.05){ ridges.push({a:pendingRidge,b:p}); } pendingRidge=null; commit(); }
    drawPlan(); build3D(); return; }
  // contur
  if(footClosed){ footClosed=false; foot=[]; openings=[]; }
  if(foot.length>=3){ const f=foot[0]; if(Math.hypot(w.x-f.x,w.z-f.z)<0.3){ footClosed=true; mode='edit'; setTools(); drawPlan(); build3D(); return; } }
  foot.push({x:snap(w.x),z:snap(w.z)}); drawPlan(); build3D();
});
pc.addEventListener('pointermove',ev=>{ if(!drag) return; const w=world(ev);
  if(drag.kind==='foot') foot[drag.i]={x:snap(w.x),z:snap(w.z)};
  else if(drag.kind==='ridge'){ const r=ridges[drag.ri]; if(r) r[drag.k]={x:snap(w.x),z:snap(w.z)}; }
  else if(drag.kind==='ridgemove'){ const r=ridges[drag.ri]; if(r){ const ddx=w.x-drag.lx, ddz=w.z-drag.lz; r.a.x=snap(r.a.x+ddx); r.a.z=snap(r.a.z+ddz); r.b.x=snap(r.b.x+ddx); r.b.z=snap(r.b.z+ddz); drag.lx=w.x; drag.lz=w.z; } }
  else if(drag.kind==='horn'){ chimneys[drag.i].x=snap(w.x); chimneys[drag.i].z=snap(w.z); }
  else if(drag.kind==='hornsize'){ const c=chimneys[drag.i]; if(c){ const d=Math.max(Math.abs(w.x-c.x),Math.abs(w.z-c.z))*2; c.size=Math.max(0.2,Math.min(3,snap(d))); } }
  else if(drag.kind==='pv'){ const it=pvItems[drag.i]; if(it){ it.x=snap(w.x); it.z=snap(w.z); } }
  else if(drag.kind==='velux'){ const v=veluxes[drag.i]; if(v){ v.x=snap(w.x); v.z=snap(w.z); } }
  else if(drag.kind==='veluxsize'){ const v=veluxes[drag.i]; if(v){ v.w=Math.max(0.4,Math.min(3,snap(Math.abs(w.x-v.x)*2))); v.l=Math.max(0.4,Math.min(4,snap(Math.abs(w.z-v.z)*2))); } }
  else if(drag.kind==='opening'){ const o=openings[drag.i]; const hit=nearestWall(w); if(o&&hit){ o.wall=hit.wall; const L=wallLen(hit.wall); o.pos=Math.max(0,Math.min(L-o.w,hit.pos-o.w/2)); } }
  drawPlan(); build3D(); renderElemList(); });
pc.addEventListener('pointermove',ev=>{ if(mode==='ridge'&&pendingRidge&&!drag){ mouseW=snapRidgePoint(world(ev)); drawPlan(); } });
window.addEventListener('pointerup',()=>{ drag=null; commit(); });
pc.addEventListener('dblclick',()=>{ if(mode==='ridge'&&pendingRidge){ pendingRidge=null; drawPlan(); } });
pc.addEventListener('wheel',ev=>{ ev.preventDefault(); const r=pc.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top;
  const wx=(mx-planMap.ox)/planMap.s, wz=(planMap.oy-my)/planMap.s;
  planZoom=Math.max(0.3,Math.min(6, planZoom*(ev.deltaY<0?1.12:0.89)));
  computeMap(); planPan.x += mx-(planMap.ox+wx*planMap.s); planPan.y += my-(planMap.oy-wz*planMap.s);
  drawPlan();
},{passive:false});

};
let pvCatalog=JSON.parse(JSON.stringify(PV_DEFAULT));
const PV_CAT={ invertor:'invertor', baterie:'baterii', tablou:'echipament', teg:'echipament', bmp:'echipament', bmpt:'echipament' };
const PV_MATCH={ tablou:'TABLOU', teg:'TEG', bmp:'BMP', bmpt:'BMPT' };
function pvIcon(cat){ return cat==='invertor'?'🔌':cat==='baterii'?'🔋':cat==='panouri'?'🟦':'🟩'; }
function pvPick(btnKey){ const cat=PV_CAT[btnKey]; const list=pvCatalog[cat]||[]; if(!list.length) return null;
  if(PV_MATCH[btnKey]){ const key=PV_MATCH[btnKey]; const m=list.find(p=>{ const N=(p.name||'').toUpperCase(); return N.includes(key) && (btnKey!=='bmp' || !N.includes('BMPT')); }); return m||list[0]; }
  return list[0]; }
function addPv(btnKey){ const cat=PV_CAT[btnKey]; const p=pvPick(btnKey); if(!p){ alert('Catalogul nu are produse pentru aceasta categorie.'); return; }
  const c=(foot.length?centroidXZ():{x:0,z:0});
  pvItems.push({cat,name:p.name,h:(+p.h||40)/100,w:(+p.w||40)/100,d:(+p.d||20)/100,x:snap(c.x),z:snap(c.z),place: cat==='panouri'?'acoperis':(cat==='baterii'?'sol':'perete')});

  const matFloor=new THREE.MeshStandardMaterial({color:0xd7dee7,roughness:1,side:THREE.DoubleSide});
  const rt=ROOF_MAT[roofType]||ROOF_MAT.tigla; const matRoof=new THREE.MeshStandardMaterial({color:rt.color,roughness:rt.rough,metalness:rt.metal,side:THREE.DoubleSide});
  const matDoor=new THREE.MeshStandardMaterial({color:0x6b4a2f,roughness:.7,side:THREE.DoubleSide});
  const matWin=new THREE.MeshStandardMaterial({color:0x9fd2ff,roughness:.3,transparent:true,opacity:.55,side:THREE.DoubleSide});
  const matChim=new THREE.MeshStandardMaterial({color:0x7a5230,roughness:.9});
  // pereti cu goluri
  const wpos=[];
  for(let i=0;i<n;i++){ const A=foot[i],B=foot[(i+1)%n]; const dx=B.x-A.x,dz=B.z-A.z,L=Math.hypot(dx,dz)||1,ux=dx/L,uz=dz/L;
    const ops=openings.filter(o=>o.wall===i).map(o=>({...o,e:o.pos+o.w})).sort((p,q)=>p.pos-q.pos);
    const solids=[]; let cur=0; ops.forEach(o=>{ if(o.pos>cur) solids.push([cur,o.pos,0,wallH]); cur=Math.max(cur,o.e); if(o.head<wallH) solids.push([o.pos,o.e,o.head,wallH]); if(o.sill>0) solids.push([o.pos,o.e,0,o.sill]); }); if(cur<L) solids.push([cur,L,0,wallH]);
    const P=(u,v)=>V(A.x+ux*u,v,A.z+uz*u);
    solids.forEach(([u0,u1,v0,v1])=>{ tri(wpos,P(u0,v0),P(u1,v0),P(u1,v1)); tri(wpos,P(u0,v0),P(u1,v1),P(u0,v1)); });
    // umplutura usa/fereastra
    ops.forEach(o=>{ const mat=(o.type==='usa')?matDoor:(o.type==='fereastra')?matWin:null; if(!mat) return; const fp=[]; tri(fp,P(o.pos,o.sill),P(o.e,o.sill),P(o.e,o.head)); tri(fp,P(o.pos,o.sill),P(o.e,o.head),P(o.pos,o.head)); building.add(meshFromTris(fp,mat)); });
  }
  building.add(meshFromTris(wpos,matWall));
  // podea
  const fpos=[]; for(let i=1;i<n-1;i++) tri(fpos,V(foot[0].x,0,foot[0].z),V(foot[i].x,0,foot[i].z),V(foot[i+1].x,0,foot[i+1].z)); building.add(meshFromTris(fpos,matFloor));
  // acoperis (pe conturul marit cu streasina)
  const rf=offsetFootprint(eaveOverhang), rn=rf.length; const rpos=[]; const ry=wallH+ridgeRaise;
  if(ridgeRaise>0.02 && roofLogic==='auto'){ buildHipRoof(rpos); }                              // automat: apele se calculeaza singure (drepte)
  else if(ridgeRaise>0.02 && ridges.length){ const apex=rf.map(p=> nearestOnRidges(p,ry)||V(p.x,ry,p.z));  // coame manuale
    for(let i=0;i<rn;i++){ const a=V(rf[i].x,wallH,rf[i].z),b=V(rf[(i+1)%rn].x,wallH,rf[(i+1)%rn].z),aa=apex[i],ab=apex[(i+1)%rn]; tri(rpos,a,b,ab); tri(rpos,a,ab,aa); } }
  else { for(let i=1;i<rn-1;i++) tri(rpos,V(rf[0].x,wallH+0.1,rf[0].z),V(rf[i].x,wallH+0.1,rf[i].z),V(rf[i+1].x,wallH+0.1,rf[i+1].z)); }
  building.add(meshFromTris(rpos,matRoof));
  // hornuri
  chimneys.forEach(ch=>{ const total=ridgeRaise+ch.height; const m=new THREE.Mesh(new THREE.BoxGeometry(ch.size,total,ch.size),matChim); m.position.set(ch.x, wallH+total/2, ch.z); building.add(m); });
  // velux (fereastra de mansarda) plata pe acoperis
  const matVlx=new THREE.MeshStandardMaterial({color:0x9fd2ff,roughness:.25,metalness:.1,transparent:true,opacity:.75,side:THREE.DoubleSide});
  veluxes.forEach(v=>{ const m=new THREE.Mesh(new THREE.BoxGeometry(v.w,0.06,v.l),matVlx); m.position.set(v.x, roofHeightAt(v.x,v.z)+0.05, v.z); building.add(m); });
  // elemente sistem fotovoltaic (cutii la dimensiunile din Excel)
  const PV_COL={ invertor:0x2b6cb0, baterii:0x2f855a, echipament:0x6b7280, panouri:0x1a3a6b };
  pvItems.forEach(it=>{ const mat=new THREE.MeshStandardMaterial({color:PV_COL[it.cat]||0x2b6cb0,roughness:.55,metalness:.2});
    let g,y;
    if(it.cat==='panouri'){ g=new THREE.BoxGeometry(it.w,it.d,it.h); y=wallH+ridgeRaise*0.5+it.d/2; }
    else { g=new THREE.BoxGeometry(it.w,it.h,it.d); y = it.place==='sol'? it.h/2 : it.place==='acoperis'? (wallH+ridgeRaise*0.5+it.h/2) : (0.9+it.h/2); }
    const m=new THREE.Mesh(g,mat); m.position.set(it.x,y,it.z); building.add(m); });
  // busola pe sol: cercuri punctate + linii radiale + puncte cardinale (fara con)
  const span=Math.max(...foot.map(p=>p.x))-Math.min(...foot.map(p=>p.x)); const span2=Math.max(...foot.map(p=>p.z))-Math.min(...foot.map(p=>p.z)); const R=Math.max(span,span2,4)*0.62+2.5;
  compass.position.set(c.x,0.02,c.z); compass.rotation.y=-orientationDeg*Math.PI/180;
  const dashOut=new THREE.LineDashedMaterial({color:0x5d6b82,dashSize:0.34,gapSize:0.22,transparent:true,opacity:.85});
  const dashIn=new THREE.LineDashedMaterial({color:0x9aa7bb,dashSize:0.28,gapSize:0.2,transparent:true,opacity:.65});
  [[R,dashOut],[R*0.64,dashIn]].forEach(([rad,mat])=>{ const pc2=[]; for(let i=0;i<=72;i++){ const a=i/72*Math.PI*2; pc2.push(new THREE.Vector3(Math.sin(a)*rad,0,-Math.cos(a)*rad)); } const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pc2),mat); ln.computeLineDistances(); compass.add(ln); });
  [0,90,180,270].forEach(deg=>{ const a=deg*Math.PI/180; const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),new THREE.Vector3(Math.sin(a)*R,0,-Math.cos(a)*R)]),dashIn); ln.computeLineDistances(); compass.add(ln); });
  [['N',0,'#c0392b'],['E',90,'#5d6b82'],['S',180,'#5d6b82'],['V',270,'#5d6b82']].forEach(([t,deg,col])=>{ const a=deg*Math.PI/180; const s=makeText(t,col); s.position.set(Math.sin(a)*(R+0.55),0.5,-Math.cos(a)*(R+0.55)); compass.add(s); });
  frameCamera(c,Math.max(span,span2,4));
}
let framed=false;
function frameCamera(c,span){ if(framed) return; framed=true; controls.target.set(c.x,wallH*0.5,c.z); camera.position.set(c.x+span*1.1,wallH+span*0.95,c.z+span*1.35); controls.update(); }
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,activeCam); }

/* ===== salvare ===== */
window.PROFCEISS_PROJECT={app:'profcad',label:'Casa',full:true,
  getState(){ return {foot,footClosed,ridges,openings,chimneys,pvItems,veluxes,wallH,ridgeRaise,eaveOverhang,roofLogic,orientationDeg,roofType}; },
  setState(s){ if(!s) return; foot=s.foot||[]; footClosed=!!s.footClosed; ridges=normalizeRidges(s.ridges); pendingRidge=null; openings=s.openings||[]; chimneys=s.chimneys||[]; pvItems=s.pvItems||[]; veluxes=s.veluxes||[]; wallH=s.wallH||3; ridgeRaise=s.ridgeRaise||0; eaveOverhang=s.eaveOverhang||0; roofLogic=s.roofLogic||'auto'; orientationDeg=s.orientationDeg||0; roofType=s.roofType||'tigla';
    $('wallH').value=Math.round(wallH*100); $('ridgeH').value=Math.round(ridgeRaise*100); $('eaveH').value=Math.round(eaveOverhang*100); $('roofLogic').value=roofLogic; $('roofType').value=roofType; const ov=$('orientVal'); if(ov) ov.innerHTML=orientationDeg+'&deg;'; drawCompassDial(); framed=false; drawPlan(); build3D(); renderBom(); renderElemList(); }
};

/* ===== start ===== */
window.addEventListener('resize',()=>{ sizeView(); drawPlan(); });
sizeView(); setTools(); drawCompassDial(); drawPlan(); build3D(); renderBom(); renderElemList(); commit(); animate();
</script>
